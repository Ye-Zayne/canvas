version: 2
updates:
  # npm 依赖（pnpm workspace）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # 把小版本更新合并成一个 PR，减少噪音
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions 版本更新
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
