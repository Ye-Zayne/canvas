name: Bug 反馈
description: 报告一个问题
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？期望的行为是什么？
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动 bridge-server ...
        2. 在 codex / claude code 里执行 ...
        3. 观察到 ...
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: 使用的客户端
      options:
        - claude code
        - codex
        - 仅浏览器（REST 调试）
        - 其他
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境信息
      description: 操作系统、Node 版本、pnpm 版本等
    validations:
      required: false
